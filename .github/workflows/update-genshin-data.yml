name: Update Genshin data

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Run generation even when all providers are already current"
        required: false
        type: boolean
        default: false
  schedule:
    # Thursday UTC catches the usual Genshin release-data publishing window.
    - cron: "23 3 * * 4"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: generated-data-updates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm

      - name: Check latest game-data sources
        id: sources
        env:
          FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          genshin_db_current="$(node -p "require('./package-lock.json').packages['node_modules/genshin-db'].version")"
          genshin_db_latest="$(npm view genshin-db version)"
          genshin_data_current="$(node -p "require('./package-lock.json').packages['node_modules/genshin-data'].version")"
          genshin_data_latest="$(npm view genshin-data version)"
          enka_current="$(node -p "require('./src/data/game-data-fallback.generated.json').sources.find(source => source.id === 'enka-network').revision")"
          enka_latest="$(gh api -X GET repos/EnkaNetwork/API-docs/commits -f path='store/gi' -f per_page=1 --jq '.[0].sha')"

          echo "genshin_db_current=$genshin_db_current" >> "$GITHUB_OUTPUT"
          echo "genshin_db_latest=$genshin_db_latest" >> "$GITHUB_OUTPUT"
          echo "genshin_data_current=$genshin_data_current" >> "$GITHUB_OUTPUT"
          echo "genshin_data_latest=$genshin_data_latest" >> "$GITHUB_OUTPUT"
          echo "enka_current=$enka_current" >> "$GITHUB_OUTPUT"
          echo "enka_latest=$enka_latest" >> "$GITHUB_OUTPUT"

          if [ "$FORCE_UPDATE" = "true" ] || \
             [ "$genshin_db_current" != "$genshin_db_latest" ] || \
             [ "$genshin_data_current" != "$genshin_data_latest" ] || \
             [ "$enka_current" != "$enka_latest" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.sources.outputs.should_run == 'true'
        run: npm ci

      - name: Update game-data dependencies
        if: steps.sources.outputs.should_run == 'true'
        run: |
          npm install --save-dev genshin-db@latest
          npm install --save-dev --save-exact genshin-data@latest

      - name: Generate data
        if: steps.sources.outputs.should_run == 'true'
        env:
          ENKA_FALLBACK_REVISION: ${{ steps.sources.outputs.enka_latest }}
        run: npm run update:game-data

      - name: Build
        if: steps.sources.outputs.should_run == 'true'
        run: npm run build

      - name: Test generated game data
        if: steps.sources.outputs.should_run == 'true'
        run: npm run test:artifact-scoring && npm run test:character-stats

      - name: Check generated character progression
        if: steps.sources.outputs.should_run == 'true'
        run: npm run check:character-stats-data

      - name: Check PNG assets
        if: steps.sources.outputs.should_run == 'true'
        run: node check-pngs.js

      - name: Enforce game-data ownership boundary
        if: steps.sources.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          unexpected=()
          while IFS= read -r path; do
            case "$path" in
              gcsim|public/gcsim/*|src/data/gcsim/*|proto/enemy.proto|src/genshin/enemy.ts|genshin/enemy.ts|src/genshin/gcsim.ts|genshin/gcsim.ts|public/locales/*/enemy.json)
                unexpected+=("$path")
                ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all | sed -E 's/^.. //; s/.* -> //')

          if [ "${#unexpected[@]}" -gt 0 ]; then
            printf 'Game-data generation changed GCSIM-owned files:\n' >&2
            printf '  %s\n' "${unexpected[@]}" >&2
            exit 1
          fi

      - name: Clean generated test artifacts
        if: always() && steps.sources.outputs.should_run == 'true'
        run: npm run clean-gen

      - name: Check for data changes
        if: steps.sources.outputs.should_run == 'true'
        id: diff
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update pull request
        if: steps.sources.outputs.should_run == 'true' && steps.diff.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          genshin_db_version="$(node -p "require('./package-lock.json').packages['node_modules/genshin-db'].version")"
          genshin_data_version="$(node -p "require('./package-lock.json').packages['node_modules/genshin-data'].version")"
          enka_revision="$(node -p "require('./src/data/game-data-fallback.generated.json').sources.find(source => source.id === 'enka-network').revision")"
          game_version="$(node -e "const text = require('fs').readFileSync('src/data/version.ts', 'utf8'); console.log(text.match(/GENSHIN_GAME_VERSION = \"([^\"]+)\"/)[1]);")"
          branch="automation/genshin-game-data"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "update Genshin game data to ${game_version}"
          git push --force-with-lease origin "$branch"

          body="$(mktemp)"
          cat > "$body" <<EOF
          Updates the generated Genshin game-data catalog.

          Generated version metadata:
          - Game: \`${game_version}\`
          - genshin-db: \`${genshin_db_version}\`
          - genshin-data: \`${genshin_data_version}\`
          - Enka: \`${enka_revision}\`

          Validation:
          - \`npm run build\`
          - \`npm run test:artifact-scoring\`
          - \`npm run test:character-stats\`
          - \`npm run check:character-stats-data\`
          - \`node check-pngs.js\`
          - \`npm run clean-gen\`
          EOF

          existing_pr="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Update Genshin game data to ${game_version}" --body-file "$body"
          else
            gh pr create --base main --head "$branch" --title "Update Genshin game data to ${game_version}" --body-file "$body"
          fi
